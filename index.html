<!-- =========================================================
     YASH — SMOOTH CATEGORY WHEEL
     CSS-only animation: lightweight, fixed, no page-flow impact
========================================================= -->

<style>
/* ---------- CATEGORY WHEEL ---------- */

#yashSmoothWheel{
    --size: 560px;

    position: fixed;
    width: var(--size);
    height: var(--size);

    right: calc(var(--size) / -2);
    top: 50%;

    transform: translate3d(0,-50%,0);

    z-index: 6000;

    pointer-events: none;

    contain: layout paint style;
    isolation: isolate;
}

/* Main rotating ring */
.yw-orbit{
    position:absolute;
    inset:0;

    border:1px solid rgba(255,255,255,.18);
    border-radius:50%;

    box-shadow:
        0 0 25px rgba(255,255,255,.035),
        inset 0 0 35px rgba(255,255,255,.025);

    animation:
        yashOrbit 45s linear infinite;

    will-change: transform;

    transform:translate3d(0,0,0);
}

/* Second subtle ring */
.yw-orbit::before{
    content:"";

    position:absolute;
    inset:34px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
}

/* Small orbit glow */
.yw-orbit::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:-3px;
    left:50%;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 20px rgba(255,255,255,.7);

    transform:translateX(-50%);
}


/* ---------- CATEGORY ITEMS ---------- */

.yw-item{
    position:absolute;

    width:92px;
    height:92px;

    margin:-46px 0 0 -46px;

    pointer-events:auto;

    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    transform:
        rotate(var(--angle))
        translateY(-230px);

    animation:
        yashItemOrbit 45s linear infinite;

    will-change:transform;
}

.yw-item-inner{
    width:78px;
    height:78px;

    border-radius:50%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    background:
        rgba(8,8,8,.72);

    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    box-shadow:
        0 0 18px rgba(255,255,255,.035);

    transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;

    /* counter rotation keeps content upright */
    animation:
        yashItemCounter 45s linear infinite;

    will-change:transform;
}

.yw-item:hover .yw-item-inner{
    background:rgba(255,255,255,.09);

    border-color:rgba(255,255,255,.85);

    box-shadow:
        0 0 12px rgba(255,255,255,.25),
        0 0 30px rgba(255,255,255,.08);
}


/* ---------- SVG ICON ---------- */

.yw-icon{
    width:27px;
    height:27px;

    fill:none;

    stroke:#fff;
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.65));

    transition:
        transform .25s ease,
        filter .25s ease;
}

.yw-item:hover .yw-icon{
    transform:scale(1.12);

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 18px rgba(255,255,255,.5));
}


/* ---------- TEXT ---------- */

.yw-label{
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:8px;
    font-weight:700;

    letter-spacing:1.1px;

    text-transform:uppercase;

    white-space:nowrap;

    text-shadow:
        0 0 8px rgba(255,255,255,.45);
}


/* ---------- CENTER ---------- */

.yw-center{
    position:absolute;

    width:125px;
    height:125px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.06),
            rgba(0,0,0,.82) 68%
        );

    border:1px solid rgba(255,255,255,.22);

    box-shadow:
        0 0 35px rgba(255,255,255,.035),
        inset 0 0 25px rgba(255,255,255,.025);

    pointer-events:auto;

    text-decoration:none;

    z-index:5;
}

.yw-center span{
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:20px;

    font-weight:900;

    letter-spacing:5px;

    margin-left:5px;

    text-shadow:
        0 0 10px rgba(255,255,255,.7),
        0 0 25px rgba(255,255,255,.2);
}

.yw-center:hover{
    border-color:rgba(255,255,255,.7);

    box-shadow:
        0 0 20px rgba(255,255,255,.15),
        0 0 50px rgba(255,255,255,.06);
}


/* ---------- ROTATION ---------- */

@keyframes yashOrbit{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes yashItemOrbit{
    from{
        transform:
            rotate(var(--angle))
            translateY(-230px)
            rotate(0deg);
    }

    to{
        transform:
            rotate(var(--angle))
            translateY(-230px)
            rotate(360deg);
    }
}

@keyframes yashItemCounter{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(-360deg);
    }
}


/* ---------- DESKTOP HOVER = SLOWER ---------- */

#yashSmoothWheel:hover .yw-orbit,
#yashSmoothWheel:hover .yw-item,
#yashSmoothWheel:hover .yw-item-inner{
    animation-duration:75s;
}


/* ---------- TABLET ---------- */

@media(max-width:900px){

    #yashSmoothWheel{
        --size:460px;

        right:-230px;
    }

    .yw-item{
        transform:
            rotate(var(--angle))
            translateY(-190px);

        animation-name:yashItemOrbit;
    }

    .yw-center{
        width:105px;
        height:105px;
    }

    .yw-center span{
        font-size:17px;
    }

    .yw-item-inner{
        width:70px;
        height:70px;
    }
}


/* ---------- MOBILE ---------- */

@media(max-width:600px){

    #yashSmoothWheel{
        --size:350px;

        right:-175px;

        opacity:.78;
    }

    .yw-item{
        width:70px;
        height:70px;

        margin:-35px 0 0 -35px;

        transform:
            rotate(var(--angle))
            translateY(-145px);
    }

    .yw-item-inner{
        width:58px;
        height:58px;

        gap:2px;
    }

    .yw-icon{
        width:21px;
        height:21px;
    }

    .yw-label{
        font-size:6px;
        letter-spacing:.7px;
    }

    .yw-center{
        width:80px;
        height:80px;
    }

    .yw-center span{
        font-size:13px;
        letter-spacing:3px;
    }
}


/* ---------- REDUCED MOTION ---------- */

@media(prefers-reduced-motion:reduce){

    .yw-orbit,
    .yw-item,
    .yw-item-inner{
        animation:none !important;
    }
}
</style>
