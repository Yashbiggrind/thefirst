<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YASH ADMIN PORTAL</title>
  <style>
    /* Reset and base */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body, html {
      margin: 0; padding: 0; height: 100%;
      background: #111;
      color: #eee;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      overflow-x: hidden;
    }
    a {
      color: #eee;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #f0a500;
    }

    /* Layout */
    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    nav.sidebar {
      width: 280px;
      background: #000;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
    }
    nav.sidebar h1 {
      font-weight: 900;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 40px;
      color: #f0a500;
      user-select: text;
    }
    nav.sidebar ul {
      list-style: none;
      margin: 0; padding: 0;
      flex-grow: 1;
    }
    nav.sidebar li {
      margin-bottom: 18px;
    }
    nav.sidebar button {
      background: none;
      border: none;
      font-size: 16px;
      color: #ccc;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 6px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }
    nav.sidebar button.active, nav.sidebar button:hover {
      background: #f0a500;
      color: #111;
      font-weight: 700;
      box-shadow: 0 0 10px #f0a500aa;
    }
    nav.sidebar button svg {
      margin-right: 12px;
      fill: currentColor;
      width: 20px; height: 20px;
    }

    main.content {
      flex-grow: 1;
      background: #121212;
      padding: 30px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    main.content h2 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 30px;
      color: #f0a500;
      user-select: none;
    }

    /* Dashboard Cards */
    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 25px 20px;
      box-shadow: 0 0 12px #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: box-shadow 0.3s ease;
      cursor: default;
      user-select: none;
    }
    .card:hover {
      box-shadow: 0 0 20px #f0a500cc;
    }
    .card .title {
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 12px;
      color: #f0a500;
    }
    .card .value {
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
    }

    /* Buttons */
    button.primary {
      background: #f0a500;
      color: #111;
      font-weight: 700;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s ease;
      user-select: none;
      margin-top: 8px;
    }
    button.primary:hover:not(:disabled) {
      background: #dda500;
    }
    button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      border: 2px solid #f0a500;
      color: #f0a500;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
      user-select: none;
    }
    button.secondary:hover {
      background: #f0a500;
      color: #111;
    }

    /* Forms and Inputs */
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      font-size: 15px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      transition: border-color 0.3s ease;
      resize: vertical;
      user-select: text;
    }
    input[type="text"]:focus, input[type="number"]:focus,
    textarea:focus, select:focus {
      outline: none;
      border-color: #f0a500;
      background: #1d1d1d;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #f0a500;
      user-select: none;
    }
    .form-group {
      margin-bottom: 18px;
    }
    textarea {
      min-height: 80px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Bulk Upload */
    #bulk-upload-area {
      border: 3px dashed #444;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      color: #777;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
      user-select: none;
      margin-bottom: 20px;
      position: relative;
    }
    #bulk-upload-area.dragover {
      border-color: #f0a500;
      background-color: #1a1a1a;
      color: #f0a500;
    }
    #bulk-upload-area input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    #bulk-upload-area p {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    /* Image previews */
    .preview-grid {
      display: flex;
      flex-wrap: wrap;
      margin-top: 15px;
      gap: 16px;
    }
    .preview-card {
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      width: 110px;
      height: 110px;
      position: relative;
      box-shadow: 0 0 8px #000;
      cursor: grab;
      transition: box-shadow 0.3s ease;
      user-select: none;
    }
    .preview-card.dragging {
      opacity: 0.6;
      box-shadow: 0 0 15px #f0a500;
      cursor: grabbing;
    }
    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      height: 12px;
      margin-top: 15px;
      margin-bottom: 25px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #f0a500;
      transition: width 0.4s ease;
    }

    /* Grouping & editing */
    .grouping-container {
      margin-top: 25px;
    }
    .product-group {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 0 10px #000;
      transition: background-color 0.3s ease;
      user-select: text;
    }
    .product-group .group-title {
      margin-bottom: 12px;
      font-weight: 800;
      font-size: 20px;
      color: #f0a500;
    }
    .product-group .images-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      margin-bottom: 18px;
    }
    .product-group .images-row img {
      border-radius: 8px;
      width: 80px;
      height: 80px;
      object-fit: cover;
      box-shadow: 0 0 6px #000;
      user-select: none;
    }

    /* Product Editor */
    form#product-editor {
      background: #1f1f1f;
      border-radius: 16px;
      padding: 30px 30px 40px 30px;
      max-width: 700px;
      box-shadow: 0 0 20px #222;
      margin-top: 30px;
      user-select: text;
    }
    form#product-editor h3 {
      font-weight: 800;
      font-size: 22px;
      color: #f0a500;
      margin-bottom: 24px;
      user-select: text;
    }
    .form-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .form-row > div {
      flex: 1 1 200px;
      min-width: 200px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #f0a500;
    }
    /* Table for grid */
    table {
      width: 100%;
      border-collapse: collapse;
      user-select: none;
    }
    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #222;
      color: #ccc;
      font-size: 14px;
      vertical-align: middle;
    }
    th {
      color: #f0a500;
      font-weight: 700;
      background: #121212;
      position: sticky;
      top: 0;
      user-select: text;
    }
    tr:hover {
      background: #1e1e1e;
    }
    .action-buttons button {
      margin-right: 6px;
      background: none;
      border: none;
      color: #f0a500;
      cursor: pointer;
      font-size: 16px;
      transition: color 0.3s ease;
    }
    .action-buttons button:hover {
      color: #dda500;
    }
    input[type="checkbox"] {
      cursor: pointer;
      accent-color: #f0a500;
    }

    /* Search, filter and sort controls */
    .controls {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      user-select: none;
    }
    .controls > * {
      flex-shrink: 0;
    }
    .controls input[type="search"] {
      width: 200px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      user-select: text;
    }
    .controls select {
      background: #222;
      color: #eee;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #444;
      user-select: text;
    }
    .bulk-actions {
      display: flex;
      gap: 10px;
    }
    .bulk-actions button {
      font-size: 14px;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 900px) {
      nav.sidebar {
        width: 220px;
        padding: 20px 16px;
      }
      main.content {
        padding: 20px 25px;
      }
      .form-row {
        flex-direction: column;
      }
      .form-row > div {
        min-width: 100%;
      }
    }
    @media (max-width: 550px) {
      nav.sidebar {
        width: 60px;
        padding: 20px 8px;
      }
      nav.sidebar h1 {
        display: none;
      }
      nav.sidebar button {
        justify-content: center;
        padding: 12px 0;
      }
      nav.sidebar button span {
        display: none;
      }
      main.content {
        padding: 15px 15px;
      }
      .controls {
        flex-direction: column;
        gap: 10px;
      }
      .controls input[type="search"], .controls select {
        width: 100%;
      }
      .preview-grid {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <nav class="sidebar" aria-label="Primary Navigation">
      <h1>YASH ADMIN PORTAL</h1>
      <ul role="menu">
        <li><button role="menuitem" id="menu-dashboard" aria-current="page" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg><span>Dashboard</span></button></li>
        <li><button role="menuitem" id="menu-catalogue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v2H3V4zm0 14h18v2H3v-2zm0-7h18v2H3v-2z"/></svg><span>Products / Catalogue</span></button></li>
        <li><button role="menuitem" id="menu-add-product"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6v-2z"/></svg><span>Add Product</span></button></li>
        <li><button role="menuitem" id="menu-bulk-upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.17v6h6V9h3.17L12 2z"/></svg><span>Bulk Upload</span></button></li>
        <li><button role="menuitem" id="menu-categories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8v-2H3v2zm0 6h8v-2H3v2zm0-12h8V5H3v2zm10 6h8v-2h-8v2zm0 6h8v-2h-8v2zm0-12h8V5h-8v2z"/></svg><span>Categories</span></button></li>
        <li><button role="menuitem" id="menu-inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/></svg><span>Inventory</span></button></li>
        <li><button role="menuitem" id="menu-orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v2H3zm0 14h18v2H3zm0-7h18v2H3z"/></svg><span>Orders</span></button></li>
        <li><button role="menuitem" id="menu-customers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Customers</span></button></li>
        <li><button role="menuitem" id="menu-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.07-.63.07-.94s-.03-.63-.07-.94l2.03-1.58-1.9-3.28-2.39 1c-.5-.38-1.04-.7-1.64-.94L14.5 4h-5l-.27 2.14c-.6.24-1.14.56-1.64.94l-2.39-1-1.9 3.28 2.03 1.58c-.04.31-.07.63-.07.94s.03.63.07.94l-2.03 1.58 1.9 3.28 2.39-1c.5.38 1.04.7 1.64.94L9.5 20h5l.27-2.14c.6-.24 1.14-.56 1.64-.94l2.39 1 1.9-3.28-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg><span>Settings</span></button></li>
      </ul>
    </nav>
    <main class="content" id="main-content" tabindex="-1">
      <!-- Dynamic content inserted here by JS -->
    </main>
  </div>

  <script>
    (function(){
      // Data models
      // Sample categories
      const categories = [
        {id: 'cat1', name: "Men's Clothing"},
        {id: 'cat2', name: "Women's Clothing"},
        {id: 'cat3', name: "Accessories"},
        {id: 'cat4', name: "Footwear"}
      ];
      // Sample products
      let products = [
        {
          id: generateId(),
          name: "Classic Black T-shirt",
          categoryId: 'cat1',
          price: 29.99,
          discountPrice: 19.99,
          sku: "YASH-TS-BLK",
          description: "Premium black t-shirt with soft fabric.",
          sizes: ["S", "M", "L", "XL"],
          stockQty: 120,
          images: ["https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=600&q=80"],
          status: "Published",
          featured: true,
          createdAt: new Date("2023-01-25T10:00:00"),
        },
        {
          id: generateId(),
          name: "White Sneakers",
          categoryId: 'cat4',
          price: 49.99,
          discountPrice: 39.99,
          sku: "YASH-SNK-WHT",
          description: "Comfortable and stylish white sneakers.",
          sizes: ["7", "8", "9", "10"],
          stockQty: 50,
          images: ["https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80"],
          status: "Draft",
          featured: false,
          createdAt: new Date("2023-05-15T14:35:00"),
        }
      ];

      // UI state
      let currentSection = 'dashboard';

      // Utility functions
      function generateId() {
        return 'id-' + Math.random().toString(36).substr(2, 16);
      }

      function formatPrice(n) {
        return "₹ " + n.toFixed(2);
      }

      // DOM helpers
      const mainContent = document.getElementById('main-content');
      const sidebarButtons = document.querySelectorAll('nav.sidebar button[role="menuitem"]');

      function setActiveMenu(id) {
        sidebarButtons.forEach(btn => {
          if(btn.id === id) {
            btn.classList.add('active');
            btn.setAttribute('aria-current', 'page');
          } else {
            btn.classList.remove('active');
            btn.removeAttribute('aria-current');
          }
        });
      }

      // Section loaders
      function loadDashboard() {
        mainContent.innerHTML = `
          <h2>Dashboard</h2>
          <div class="dashboard-cards" role="list">
            <div class="card" role="listitem" aria-label="Total Products">
              <div class="title">Total Products</div>
              <div class="value">${products.length}</div>
            </div>
            <div class="card" role="listitem" aria-label="Published Products">
              <div class="title">Published</div>
              <div class="value">${products.filter(p=>p.status==='Published').length}</div>
            </div>
            <div class="card" role="listitem" aria-label="Draft Products">
              <div class="title">Drafts</div>
              <div class="value">${products.filter(p=>p.status==='Draft').length}</div>
            </div>
            <div class="card" role="listitem" aria-label="Featured Products">
              <div class="title">Featured</div>
              <div class="value">${products.filter(p=>p.featured).length}</div>
            </div>
          </div>
          <p>Welcome to the YASH ADMIN PORTAL. Use the navigation to manage your store.</p>
        `;
      }

      /* ---- BULK UPLOAD ---- */
      let bulkUploadFiles = [];
      let bulkGroups = [];

      function loadBulkUpload() {
        mainContent.innerHTML = `
          <h2>Bulk Product Upload</h2>
          <div id="bulk-upload-area" tabindex="0" aria-label="Drag and drop images here or click to select files" role="button">
            <p>Drag & Drop or Click to Select Multiple Images</p>
            <input type="file" id="bulk-upload-input" multiple accept="image/*" aria-describedby="upload-desc"/>
          </div>
          <div class="progress-bar-container" aria-hidden="true" style="display:none;">
            <div class="progress-bar"></div>
          </div>
          <div id="upload-warning" style="color:#f44336; margin: 0 0 20px 0; display:none;"></div>
          <div id="preview-container" aria-live="polite"></div>
          <div style="margin-top: 30px;">
            <button class="primary" id="btn-next" disabled>Next: Review Grouping</button>
          </div>
          <div id="group-review-section" style="display:none;"></div>
          <div style="margin-top: 20px; display:none;" id="publish-all-section">
            <button class="primary" id="btn-publish-all">Publish All Products</button>
          </div>
        `;

        const uploadArea = document.getElementById('bulk-upload-area');
        const fileInput = document.getElementById('bulk-upload-input');
        const progressBarContainer = document.querySelector('.progress-bar-container');
        const progressBar = document.querySelector('.progress-bar');
        const previewContainer = document.getElementById('preview-container');
        const uploadWarning = document.getElementById('upload-warning');
        const btnNext = document.getElementById('btn-next');
        const groupReviewSection = document.getElementById('group-review-section');
        const publishSection = document.getElementById('publish-all-section');
        const btnPublishAll = document.getElementById('btn-publish-all');

        function resetUpload() {
          bulkUploadFiles = [];
          bulkGroups = [];
          btnNext.disabled = true;
          previewContainer.innerHTML = '';
          groupReviewSection.style.display = 'none';
          publishSection.style.display = 'none';
          progressBarContainer.style.display = 'none';
          progressBar.style.width = '0%';
          uploadWarning.style.display = 'none';
        }

        resetUpload();

        uploadArea.addEventListener('dragover', (e) => {
          e.preventDefault();
          uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', (e) => {
          e.preventDefault();
          uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
          e.preventDefault();
          uploadArea.classList.remove('dragover');
          if(e.dataTransfer.files.length > 0) {
            handleFiles(e.dataTransfer.files);
          }
        });
        uploadArea.addEventListener('keypress', (e) => {
          if(e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            fileInput.click();
          }
        });
        fileInput.addEventListener('change', (e) => {
          if(e.target.files.length > 0) {
            handleFiles(e.target.files);
          }
        });

        function handleFiles(fileList) {
          if(fileList.length + bulkUploadFiles.length > 100) {
            uploadWarning.textContent = "Maximum 100 images allowed at once for bulk upload.";
            uploadWarning.style.display = 'block';
            return;
          }
          uploadWarning.style.display = 'none';
          const newFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
          bulkUploadFiles = bulkUploadFiles.concat(newFiles);
          renderPreviews();
          btnNext.disabled = bulkUploadFiles.length === 0;
        }

        function renderPreviews() {
          previewContainer.innerHTML = '';
          if(bulkUploadFiles.length === 0) {
            previewContainer.innerHTML = `<p style="color:#777;">No images selected.</p>`;
            return;
          }
          const fragment = document.createDocumentFragment();
          const grid = document.createElement('div');
          grid.className = 'preview-grid';
          bulkUploadFiles.forEach((file, i) => {
            const url = URL.createObjectURL(file);
            const card = document.createElement('div');
            card.className = 'preview-card';
            card.title = file.name;
            const img = document.createElement('img');
            img.src = url;
            img.alt = file.name;
            card.appendChild(img);
            grid.appendChild(card);
          });
          fragment.appendChild(grid);
          previewContainer.appendChild(fragment);
        }

        btnNext.addEventListener('click', () => {
          // Simulate upload and grouping workflow:
          btnNext.disabled = true;
          progressBarContainer.style.display = 'block';
          let progress = 0;
          const interval = setInterval(() => {
            progress += Math.random()*15;
            if(progress >= 100) {
              clearInterval(interval);
              progressBar.style.width = '100%';
              // After "upload", create dummy groups for demo
              createGroupsFromFiles();
              showGroupReview();
              progressBarContainer.style.display = 'none';
            } else {
              progressBar.style.width = progress + '%';
            }
          }, 200);
        });

        function createGroupsFromFiles() {
          // Basic automatic grouping:
          // Group images in sets of 4 for demo purposes
          bulkGroups = [];
          for(let i=0; i < bulkUploadFiles.length; i += 4) {
            bulkGroups.push({
              id: generateId(),
              images: bulkUploadFiles.slice(i, i+4),
              data: {
                name: '',
                categoryId: '',
                price: 0,
                discountPrice: 0,
                sku: '',
                description: '',
                sizes: [],
                stockQty: 0,
                status: 'Draft',
                featured: false,
              }
            });
          }
        }

        function showGroupReview() {
          groupReviewSection.style.display = 'block';
          publishSection.style.display = 'block';
          previewContainer.innerHTML = '';

          function createImagePreview(imgFile) {
            const url = URL.createObjectURL(imgFile);
            const img = document.createElement('img');
            img.src = url;
            img.alt = imgFile.name;
            return img;
          }

          groupReviewSection.innerHTML = '';
          bulkGroups.forEach((group, idx) => {
            const pg = document.createElement('section');
            pg.className = 'product-group';
            pg.setAttribute('tabindex', '0');
            pg.setAttribute('aria-label', `Product Group ${idx + 1}`);

            const header = document.createElement('div');
            header.className = 'group-title';
            header.textContent = `Product Group ${idx + 1}`;
            pg.appendChild(header);

            const imagesRow = document.createElement('div');
            imagesRow.className = 'images-row';
            group.images.forEach(imgFile => {
              imagesRow.appendChild(createImagePreview(imgFile));
            });
            pg.appendChild(imagesRow);

            // Render editable form fields for product info inline
            const form = document.createElement('form');
            form.style.marginTop = '10px';
            form.onsubmit = e => e.preventDefault();

            // Fields create helper
            function createInput(labelText, type = 'text', value = '', id = '', placeholder = '') {
              const div = document.createElement('div');
              div.className = 'form-group';
              const label = document.createElement('label');
              label.textContent = labelText;
              if(id) label.htmlFor = id;
              const input = document.createElement('input');
              input.type = type;
              input.value = value;
              input.id = id;
              input.placeholder = placeholder;
              div.appendChild(label);
              div.appendChild(input);
              return {div, input};
            }
            function createTextArea(labelText, value = '', id = '', placeholder = '') {
              const div = document.createElement('div');
              div.className = 'form-group';
              const label = document.createElement('label');
              label.textContent = labelText;
              if(id) label.htmlFor = id;
              const textarea = document.createElement('textarea');
              textarea.value = value;
              textarea.id = id;
              textarea.placeholder = placeholder;
              div.appendChild(label);
              div.appendChild(textarea);
              return {div, textarea};
            }
            function createSelect(labelText, options = [], value = '', id = '') {
              const div = document.createElement('div');
              div.className = 'form-group';
              const label = document.createElement('label');
              label.textContent = labelText;
              if(id) label.htmlFor = id;
              const select = document.createElement('select');
              select.id = id;
              options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt.id;
                option.textContent = opt.name;
                if(opt.id === value) option.selected = true;
                select.appendChild(option);
              });
              div.appendChild(label);
              div.appendChild(select);
              return {div, select};
            }

            // Name
            const {div: nameDiv, input: nameInput} = createInput('Product Name', 'text', group.data.name);
            form.appendChild(nameDiv);

            // Category dropdown
            const {div: catDiv, select: catSelect} = createSelect('Category', categories, group.data.categoryId);
            form.appendChild(catDiv);

            // Price & Discount
            const priceDiv = document.createElement('div');
            priceDiv.className = 'form-row';
            const {div: priceInputDiv, input: priceInput} = createInput('Price', 'number', group.data.price, '', '0.00');
            priceInput.min = '0'; priceInput.step = '0.01';
            priceInputDiv.style.flex = '1';
            const {div: discPriceDiv, input: discPriceInput} = createInput('Discount Price', 'number', group.data.discountPrice, '', '0.00');
            discPriceInput.min = '0'; discPriceInput.step = '0.01';
            discPriceInputDiv.style.flex = '1';
            priceDiv.appendChild(priceInputDiv);
            priceDiv.appendChild(discPriceInputDiv);
            form.appendChild(priceDiv);

            // SKU
            const {div: skuDiv, input: skuInput} = createInput('SKU', 'text', group.data.sku);
            form.appendChild(skuDiv);

            // Description
            const {div: descDiv, textarea: descTextarea} = createTextArea('Description', group.data.description);
            form.appendChild(descDiv);

            // Sizes input, comma-separated
            const {div: sizesDiv, input: sizesInput} = createInput('Sizes (comma separated)', 'text', group.data.sizes.join(', '));
            form.appendChild(sizesDiv);

            // Stock quantity
            const {div: stockDiv, input: stockInput} = createInput('Stock Quantity', 'number', group.data.stockQty);
            stockInput.min = '0'; stockInput.step = '1';
            form.appendChild(stockDiv);

            // Status and Featured checkbox
            const statusDiv = document.createElement('div');
            statusDiv.className = 'form-row';

            const statusGroup = document.createElement('div');
            statusGroup.className = 'form-group';
            const statusLabel = document.createElement('label');
            statusLabel.textContent = 'Product Status';
            statusGroup.appendChild(statusLabel);
            const statusSelect = document.createElement('select');
            ['Draft', 'Published'].forEach(val => {
              const opt = document.createElement('option');
              opt.value = val;
              opt.textContent = val;
              if(val === group.data.status) opt.selected = true;
              statusSelect.appendChild(opt);
            });
            statusGroup.appendChild(statusSelect);
            statusDiv.appendChild(statusGroup);

            const featuredGroup = document.createElement('label');
            featuredGroup.className = 'checkbox-group';
            const featuredCheckbox = document.createElement('input');
            featuredCheckbox.type = 'checkbox';
            featuredCheckbox.checked = group.data.featured;
            featuredGroup.appendChild(featuredCheckbox);
            featuredGroup.append(' Featured product');
            statusDiv.appendChild(featuredGroup);

            form.appendChild(statusDiv);

            pg.appendChild(form);

            // Save fields back to bulkGroups data on input change
            function saveData() {
              group.data.name = nameInput.value.trim();
              group.data.categoryId = catSelect.value;
              group.data.price = parseFloat(priceInput.value) || 0;
              group.data.discountPrice = parseFloat(discPriceInput.value) || 0;
              group.data.sku = skuInput.value.trim();
              group.data.description = descTextarea.value.trim();
              group.data.sizes = sizesInput.value.split(',').map(s => s.trim()).filter(Boolean);
              group.data.stockQty = parseInt(stockInput.value) || 0;
              group.data.status = statusSelect.value;
              group.data.featured = featuredCheckbox.checked;
            }

            [nameInput, catSelect, priceInput, discPriceInput, skuInput, descTextarea, sizesInput, stockInput, statusSelect, featuredCheckbox].forEach(el => {
              el.addEventListener('input', saveData);
              el.addEventListener('change', saveData);
            });

            groupReviewSection.appendChild(pg);
          });

          btnPublishAll.onclick = () => {
            // Validate and publish all groups as products
            let valid = true;
            const errors = [];
            bulkGroups.forEach((group, idx) => {
              if(!group.data.name) errors.push(`Product Group ${idx + 1} missing name.`);
              if(!group.data.categoryId) errors.push(`Product Group ${idx + 1} missing category.`);
              if(group.data.price <= 0) errors.push(`Product Group ${idx + 1} must have a price > 0.`);
              if(group.data.stockQty < 0) errors.push(`Product Group ${idx + 1} stock quantity invalid.`);
              if(group.data.images.length === 0) errors.push(`Product Group ${idx + 1} has no images.`);
            });
            if(errors.length > 0) {
              alert("Cannot publish due to errors:\n" + errors.join('\n'));
              return;
            }

            // Add groups to products array as new products
            bulkGroups.forEach(group => {
              products.push({
                id: generateId(),
                name: group.data.name,
                categoryId: group.data.categoryId,
                price: group.data.price,
                discountPrice: group.data.discountPrice,
                sku: group.data.sku,
                description: group.data.description,
                sizes: group.data.sizes,
                stockQty: group.data.stockQty,
                images: group.images.map(f => URL.createObjectURL(f)), // Placeholder for real image URLs
                status: group.data.status,
                featured: group.data.featured,
                createdAt: new Date()
              });
            });

            // Reset bulk upload state and go to catalogue
            alert(`Published ${bulkGroups.length} products successfully.`);
            bulkUploadFiles = [];
            bulkGroups = [];
            loadCatalogue();
            setActiveMenu('menu-catalogue');
          };
        }
      }

      /* ---- CATALOGUE ---- */
      let catalogueFilters = {
        search: '',
        category: '',
        sortBy: 'newest',
        bulkSelection: new Set()
      };

      function loadCatalogue() {
        mainContent.innerHTML = `
          <h2>Products / Catalogue</h2>
          <div class="controls" role="region" aria-label="Catalogue Controls">
            <input type="search" id="search-products" placeholder="Search products..." aria-label="Search products" />
            <select id="filter-category" aria-label="Filter by category">
              <option value="">All Categories</option>
              ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
            <select id="sort-products" aria-label="Sort products">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="stock-asc">Stock: Low to High</option>
              <option value="stock-desc">Stock: High to Low</option>
            </select>
            <div class="bulk-actions" aria-label="Bulk actions">
              <button id="btn-bulk-publish" disabled>Publish Selected</button>
              <button id="btn-bulk-unpublish" disabled>Unpublish Selected</button>
              <button id="btn-bulk-delete" disabled>Delete Selected</button>
            </div>
          </div>
          <table aria-describedby="catalogue-desc">
            <thead>
              <tr>
                <th><input type="checkbox" id="select-all-products" aria-label="Select all products" /></th>
                <th>Image</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Featured</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-list">
              <!-- Rows here -->
            </tbody>
          </table>
          <p id="catalogue-desc" style="margin-top:8px; color:#777;">Manage products here. Use search, filters, and bulk actions.</p>
          <div id="product-editor-container" style="margin-top:40px;"></div>
        `;

        const searchInput = document.getElementById('search-products');
        const categoryFilter = document.getElementById('filter-category');
        const sortSelect = document.getElementById('sort-products');
        const productList = document.getElementById('product-list');
        const selectAllCheckbox = document.getElementById('select-all-products');
        const btnBulkPublish = document.getElementById('btn-bulk-publish');
        const btnBulkUnpublish = document.getElementById('btn-bulk-unpublish');
        const btnBulkDelete = document.getElementById('btn-bulk-delete');
        const productEditorContainer = document.getElementById('product-editor-container');

        catalogueFilters.bulkSelection.clear();
        selectAllCheckbox.checked = false;
        btnBulkPublish.disabled = true;
        btnBulkUnpublish.disabled = true;
        btnBulkDelete.disabled = true;

        function renderProductRows() {
          let filtered = products.filter(p => {
            const matchesSearch = p.name.toLowerCase().includes(catalogueFilters.search.toLowerCase());
            const matchesCategory = catalogueFilters.category ? p.categoryId === catalogueFilters.category : true;
            return matchesSearch && matchesCategory;
          });

          switch(catalogueFilters.sortBy) {
            case 'price-asc': filtered.sort((a,b) => a.price - b.price); break;
            case 'price-desc': filtered.sort((a,b) => b.price - a.price); break;
            case 'stock-asc': filtered.sort((a,b) => a.stockQty - b.stockQty); break;
            case 'stock-desc': filtered.sort((a,b) => b.stockQty - a.stockQty); break;
            case 'newest': filtered.sort((a,b) => b.createdAt - a.createdAt); break;
          }

          productList.innerHTML = '';
          if(filtered.length === 0) {
            productList.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 20px; color:#777;">No products found.</td></tr>`;
            return;
          }

          filtered.forEach(p => {
            const tr = document.createElement('tr');
            // Checkbox
            const selectTd = document.createElement('td');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = catalogueFilters.bulkSelection.has(p.id);
            checkbox.setAttribute('aria-label', `Select product ${p.name}`);
            checkbox.onchange = (e) => {
              if(e.target.checked) {
                catalogueFilters.bulkSelection.add(p.id);
              } else {
                catalogueFilters.bulkSelection.delete(p.id);
              }
              updateBulkButtons();
              selectAllCheckbox.checked = catalogueFilters.bulkSelection.size === filtered.length;
            };
            selectTd.appendChild(checkbox);
            tr.appendChild(selectTd);

            // Image
            const imgTd = document.createElement('td');
            if(p.images.length) {
              const img = document.createElement('img');
              img.src = p.images[0];
              img.alt = p.name;
              img.style.width = '50px';
              img.style.height = '50px';
              img.style.objectFit = 'cover';
              img.style.borderRadius = '6px';
              imgTd.appendChild(img);
            }
            tr.appendChild(imgTd);

            // Name
            const nameTd = document.createElement('td');
            nameTd.textContent = p.name;
            tr.appendChild(nameTd);

            // Category
            const catTd = document.createElement('td');
            const cat = categories.find(c => c.id === p.categoryId);
            catTd.textContent = cat ? cat.name : 'Uncategorized';
            tr.appendChild(catTd);

            // Price
            const priceTd = document.createElement('td');
            priceTd.textContent = p.discountPrice > 0 && p.discountPrice < p.price ? `${formatPrice(p.discountPrice)} (Disc)` : formatPrice(p.price);
            tr.appendChild(priceTd);

            // Stock
            const stockTd = document.createElement('td');
            stockTd.textContent = p.stockQty;
            tr.appendChild(stockTd);

            // Status
            const statusTd = document.createElement('td');
            statusTd.textContent = p.status;
            tr.appendChild(statusTd);

            // Featured
            const featuredTd = document.createElement('td');
            featuredTd.textContent = p.featured ? 'Yes' : 'No';
            tr.appendChild(featuredTd);

            // Actions: Edit, Delete, Duplicate
            const actionsTd = document.createElement('td');
            actionsTd.className = 'action-buttons';

            // Edit button
            const btnEdit = document.createElement('button');
            btnEdit.title = `Edit ${p.name}`;
            btnEdit.innerHTML = '✏️';
            btnEdit.onclick = () => {
              renderProductEditor(p);
            };
            actionsTd.appendChild(btnEdit);

            // Delete button
            const btnDelete = document.createElement('button');
            btnDelete.title = `Delete ${p.name}`;
            btnDelete.innerHTML = '🗑️';
            btnDelete.onclick = () => {
              if(confirm(`Delete product "${p.name}"? This cannot be undone.`)) {
                products = products.filter(prod => prod.id !== p.id);
                renderProductRows();
                productEditorContainer.innerHTML = '';
              }
            };
            actionsTd.appendChild(btnDelete);

            // Duplicate button
            const btnDuplicate = document.createElement('button');
            btnDuplicate.title = `Duplicate ${p.name}`;
            btnDuplicate.innerHTML = '📋';
            btnDuplicate.onclick = () => {
              const newProd = {...p, id: generateId(), name: p.name + ' (Copy)'};
              products.push(newProd);
              renderProductRows();
            };
            actionsTd.appendChild(btnDuplicate);

            tr.appendChild(actionsTd);
            productList.appendChild(tr);
          });
          updateBulkButtons();
        }

        function updateBulkButtons() {
          const selectedCount = catalogueFilters.bulkSelection.size;
          btnBulkPublish.disabled = selectedCount === 0;
          btnBulkUnpublish.disabled = selectedCount === 0;
          btnBulkDelete.disabled = selectedCount === 0;
        }

        function renderProductEditor(product) {
          productEditorContainer.innerHTML = '';
          const form = document.createElement('form');
          form.id = 'product-editor';
          form.setAttribute('aria-label', `Edit product ${product.name}`);

          form.innerHTML = `<h3>Edit Product: ${product.name}</h3>`;

          // Helper to create inputs
          function createInput(label, type, value, name, placeholder='') {
            return `
              <div class="form-group">
                <label for="edit-${name}">${label}</label>
                <input type="${type}" id="edit-${name}" name="${name}" value="${value}" placeholder="${placeholder}" />
              </div>
            `;
          }
          function createTextarea(label, value, name, placeholder='') {
            return `
              <div class="form-group">
                <label for="edit-${name}">${label}</label>
                <textarea id="edit-${name}" name="${name}" placeholder="${placeholder}">${value}</textarea>
              </div>
            `;
          }
          function createSelect(label, options, selected, name) {
            return `
              <div class="form-group">
                <label for="edit-${name}">${label}</label>
                <select id="edit-${name}" name="${name}">
                  ${options.map(o => `<option value="${o.id}" ${o.id === selected ? 'selected' : ''}>${o.name}</option>`).join('')}
                </select>
              </div>
            `;
          }
          form.innerHTML += createInput("Product Name", "text", product.name, "name");
          form.innerHTML += createSelect("Category", categories, product.categoryId, "categoryId");
          form.innerHTML += createInput("Price", "number", product.price, "price", "0.00");
          form.innerHTML += createInput("Discount Price", "number", product.discountPrice, "discountPrice", "0.00");
          form.innerHTML += createInput("SKU", "text", product.sku, "sku");
          form.innerHTML += createTextarea("Description", product.description, "description");
          form.innerHTML += createInput("Sizes (comma separated)", "text", product.sizes.join(', '), "sizes");
          form.innerHTML += createInput("Stock Quantity", "number", product.stockQty, "stockQty");
          form.innerHTML += `
            <div class="form-row">
              <div class="form-group">
                <label for="edit-status">Product Status</label>
                <select id="edit-status" name="status">
                  <option value="Draft" ${product.status==='Draft' ? 'selected' : ''}>Draft</option>
                  <option value="Published" ${product.status==='Published' ? 'selected' : ''}>Published</option>
                </select>
              </div>
              <label class="checkbox-group" style="align-self:center;">
                <input type="checkbox" id="edit-featured" name="featured" ${product.featured ? 'checked' : ''} />
                Featured product
              </label>
            </div>
          `;

          // Images preview & upload placeholder (images management ideally connected to backend later)
          const imgPreviewHtml = product.images.map(src => `<img src="${src}" alt="${product.name}" style="width:80px; height:80px; border-radius:8px; margin-right:8px; object-fit:cover;">`).join('');
          form.innerHTML += `
            <div class="form-group">
              <label>Product Images</label>
              <div style="display:flex; gap:10px; flex-wrap: wrap;">${imgPreviewHtml}</div>
              <small style="color:#888;">Image upload functionality to be integrated.</small>
            </div>
          `;

          // Save & Cancel buttons
          form.innerHTML += `
            <div style="margin-top: 20px;">
              <button type="submit" class="primary">Save Changes</button>
              <button type="button" id="cancel-edit" class="secondary" style="margin-left:10px;">Cancel</button>
            </div>
          `;

          productEditorContainer.appendChild(form);

          form.onsubmit = e => {
            e.preventDefault();
            const fd = new FormData(form);
            const updated = {
              ...product,
              name: fd.get('name').trim(),
              categoryId: fd.get('categoryId'),
              price: parseFloat(fd.get('price')) || 0,
              discountPrice: parseFloat(fd.get('discountPrice')) || 0,
              sku: fd.get('sku').trim(),
              description: fd.get('description').trim(),
              sizes: fd.get('sizes').split(',').map(s => s.trim()).filter(Boolean),
              stockQty: parseInt(fd.get('stockQty')) || 0,
              status: fd.get('status'),
              featured: fd.get('featured') === 'on',
            };

            if(!updated.name) {
              alert('Product name is required.');
              return;
            }
            if(updated.price <= 0) {
              alert('Price must be greater than zero.');
              return;
            }
            // Update product in array
            products = products.map(p => p.id === updated.id ? updated : p);
            alert('Product updated successfully!');
            productEditorContainer.innerHTML = '';
            renderProductRows();
          };
          document.getElementById('cancel-edit').onclick = () => {
            productEditorContainer.innerHTML = '';
          };
        }

        function updateFilters() {
          catalogueFilters.search = searchInput.value.trim();
          catalogueFilters.category = categoryFilter.value;
          catalogueFilters.sortBy = sortSelect.value;
          renderProductRows();
        }

        searchInput.oninput = updateFilters;
        categoryFilter.onchange = updateFilters;
        sortSelect.onchange = updateFilters;

        selectAllCheckbox.onclick = () => {
          const check = selectAllCheckbox.checked;
          catalogueFilters.bulkSelection.clear();
          if(check) {
            const filteredIds = products.filter(p=>{
              const matchesSearch = p.name.toLowerCase().includes(catalogueFilters.search.toLowerCase());
              const matchesCategory = catalogueFilters.category ? p.categoryId === catalogueFilters.category : true;
              return matchesSearch && matchesCategory;
            }).map(p => p.id);
            filteredIds.forEach(id => catalogueFilters.bulkSelection.add(id));
          }
          renderProductRows();
        };

        function bulkUpdateStatus(status) {
          catalogueFilters.bulkSelection.forEach(id => {
            const prod = products.find(p => p.id === id);
            if(prod) prod.status = status;
          });
          catalogueFilters.bulkSelection.clear();
          renderProductRows();
        }

        function bulkDeleteProducts() {
          if(confirm(`Delete ${catalogueFilters.bulkSelection.size} selected products? This cannot be undone.`)) {
            products = products.filter(p => !catalogueFilters.bulkSelection.has(p.id));
            catalogueFilters.bulkSelection.clear();
            renderProductRows();
          }
        }

        btnBulkPublish.onclick = () => {
          bulkUpdateStatus('Published');
        };
        btnBulkUnpublish.onclick = () => {
          bulkUpdateStatus('Draft');
        };
        btnBulkDelete.onclick = () => {
          bulkDeleteProducts();
        };

        renderProductRows();
      }

              <small style="color:#888;">Image upload integration coming soon.</small>
            </div>
            <button type="submit" class="primary">Add Product</button>
          </form>
        `;

        const form = document.getElementById('add-product-form');
        form.onsubmit = e => {
          e.preventDefault();
          const fd = new FormData(form);
          const newProduct = {
            id: generateId(),
            name: fd.get('name').trim(),
            categoryId: fd.get('categoryId'),
            price: parseFloat(fd.get('price')) || 0,
            discountPrice: parseFloat(fd.get('discountPrice')) || 0,
            sku: fd.get('sku').trim(),
            description: fd.get('description').trim(),
            sizes: fd.get('sizes').split(',').map(s => s.trim()).filter(Boolean),
            stockQty: parseInt(fd.get('stockQty')) || 0,
            status: fd.get('status'),
            featured: fd.get('featured') === 'on',
            images: [],
            createdAt: new Date()
          };
          if(!newProduct.name) {
            alert('Product name is required.');
            return;
          }
          if(!newProduct.categoryId) {
            alert('Category is required.');
            return;
          }
          if(newProduct.price <= 0) {
            alert('Price must be greater than zero.');
            return;
          }
          products.push(newProduct);
          alert('Product added successfully.');
          loadCatalogue();
          setActiveMenu('menu-catalogue');
        };
      }

      /* ---- CATEGORIES ---- */
      // Manage categories with create, rename, delete, assign products UI
      function loadCategories() {
        mainContent.innerHTML = `
          <h2>Categories Management</h2>
          <form id="add-category-form" aria-label="Add new category form" style="max-width: 400px; user-select:text; margin-bottom:30px;">
            <label for="new-category-name">New Category Name</label>
            <div style="display:flex; gap:10px; margin-top:6px;">
              <input type="text" id="new-category-name" required placeholder="Category name" aria-required="true" />
              <button class="primary" type="submit">Add Category</button>
            </div>
          </form>
          <div id="category-list">
            <ul style="list-style:none; padding:0; user-select:none;">
              ${categories.map(c =>
                `<li data-id="${c.id}" style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                  <input type="text" class="cat-name-input" value="${c.name}" aria-label="Category name ${c.name}" style="background:#222; border:none; color:#eee; padding:6px 10px; border-radius:6px; flex:1;" />
                  <button class="btn-save-cat secondary" title="Rename ${c.name}" aria-label="Rename category ${c.name}">Save</button>
                  <button class="btn-delete-cat secondary" title="Delete ${c.name}" aria-label="Delete category ${c.name}">Delete</button>
                </li>`
              ).join('')}
            </ul>
          </div>
          <div id="cat-assign-products" style="margin-top:40px;">
            <h3>Assign Products to Categories</h3>
            <form id="assign-products-form" aria-label="Assign products to categories" style="max-width:700px;">
              <label for="assign-product-select">Select Product</label>
              <select id="assign-product-select" required aria-required="true" style="width:100%; background:#222; color:#eee; border-radius:6px; border:none; padding:8px 10px; margin-bottom:16px;">
                <option value="" disabled selected>Select product</option>
                ${products.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
              </select>
              <label for="assign-category-select">Select New Category</label>
              <select id="assign-category-select" required aria-required="true" style="width:100%; background:#222; color:#eee; border-radius:6px; border:none; padding:8px 10px; margin-bottom:16px;">
                <option value="" disabled selected>Select category</option>
                ${categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
              </select>
              <button type="submit" class="primary">Assign Category</button>
            </form>
          </div>
        `;

        // Add new category
        const addForm = document.getElementById('add-category-form');
        addForm.onsubmit = e => {
          e.preventDefault();
          const nameInput = document.getElementById('new-category-name');
          const name = nameInput.value.trim();
          if(!name) {
            alert('Category name cannot be empty.');
            return;
          }
          if(categories.find(c => c.name.toLowerCase() === name.toLowerCase())) {
            alert('Category with this name already exists.');
            return;
          }
          categories.push({id: generateId(), name});
          alert(`Category "${name}" added.`);
          loadCategories();
        };

        // Rename and delete
        const catList = document.getElementById('category-list');
        catList.querySelectorAll('li').forEach(li => {
          const id = li.dataset.id;
          const saveBtn = li.querySelector('.btn-save-cat');
          const deleteBtn = li.querySelector('.btn-delete-cat');
          const input = li.querySelector('.cat-name-input');

          saveBtn.onclick = () => {
            const newName = input.value.trim();
            if(!newName) {
              alert('Category name cannot be empty.');
              input.value = categories.find(c => c.id === id).name;
              return;
            }
            if(categories.find(c => c.name.toLowerCase() === newName.toLowerCase() && c.id !== id)) {
              alert('Another category with this name exists.');
              input.value = categories.find(c => c.id === id).name;
              return;
            }
            const cat = categories.find(c => c.id === id);
            cat.name = newName;
            alert('Category renamed successfully.');
            loadCategories();
          };

          deleteBtn.onclick = () => {
            if(confirm('Deleting a category will NOT delete products but they will become Uncategorized.\nAre you sure?')) {
              const idx = categories.findIndex(c => c.id === id);
              if(idx >= 0) {
                categories.splice(idx, 1);
                // Remove category assignment from products
                products.forEach(p => {
                  if(p.categoryId === id) p.categoryId = '';
                });
                alert('Category deleted successfully.');
                loadCategories();
              }
            }
          };
        });

        // Assign products to categories
        const assignForm = document.getElementById('assign-products-form');
        assignForm.onsubmit = e => {
          e.preventDefault();
          const prodSelect = document.getElementById('assign-product-select');
          const catSelect = document.getElementById('assign-category-select');
          const prodId = prodSelect.value;
          const catId = catSelect.value;
          if(!prodId || !catId) {
            alert('Please select both product and category.');
            return;
          }
          const prod = products.find(p => p.id === prodId);
          prod.categoryId = catId;
          alert(`Assigned product "${prod.name}" to category "${categories.find(c => c.id===catId).name}".`);
          prodSelect.value = '';
          catSelect.value = '';
        };
      }

      /* ---- Placeholders for inventory, orders, customers, settings ---- */
      function loadPlaceholder(sectionName) {
        mainContent.innerHTML = `
          <h2>${sectionName}</h2>
          <p style="color:#aaa; font-style: italic; margin-top:20px;">This section will be developed soon.</p>
        `;
      }

      // Navigation binding
      function bindNavigation() {
        sidebarButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.id;
            setActiveMenu(id);
            switch(id) {
              case 'menu-dashboard': currentSection = 'dashboard'; loadDashboard(); break;
              case 'menu-catalogue': currentSection = 'catalogue'; loadCatalogue(); break;
              case 'menu-add-product': currentSection = 'add-product'; loadAddProduct(); break;
              case 'menu-bulk-upload': currentSection = 'bulk-upload'; loadBulkUpload(); break;
              case 'menu-categories': currentSection = 'categories'; loadCategories(); break;
              case 'menu-inventory': currentSection = 'inventory'; loadPlaceholder('Inventory'); break;
              case 'menu-orders': currentSection = 'orders'; loadPlaceholder('Orders'); break;
              case 'menu-customers': currentSection = 'customers'; loadPlaceholder('Customers'); break;
              case 'menu-settings': currentSection = 'settings'; loadPlaceholder('Settings'); break;
            }
            mainContent.focus();
          });
        });
      }

      // Initial Load
      bindNavigation();
      loadDashboard();
    })();
  </script>
</body>
</html>
